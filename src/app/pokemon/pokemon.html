<div class="pokemon-page">

  <h1>Favorite Pokémon</h1>

  <div class="region-buttons">
    <button (click)="selectRegion('kanto')">Kanto</button>
    <button (click)="selectRegion('johto')">Johto</button>
    <button (click)="selectRegion('hoenn')">Hoenn</button>
  </div>

  <h2>{{ selectedRegion | titlecase }} Region</h2>

  <div class="pokemon-grid">
    @for (pokemon of pokemon; track pokemon.name) {
      <div class="pokemon-card">
        <h3>{{ pokemon.name }}</h3>
        <p><strong>Type:</strong> {{ pokemon.type }}</p>
        <p><strong>Held Item:</strong> {{ pokemon.heldItem }}</p>
        <p>{{ pokemon.description }}</p>
      </div>
    }
  </div>

</div>
